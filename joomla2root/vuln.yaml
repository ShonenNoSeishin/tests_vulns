id: joomla2root
title: "Joomla2Root — authentification manquante dans l'installeur web de Joomla CMS"
cves: [CVE-2026-123214]
severity: critical
published: 2026-11-26
updated: 2026-11-27
exploited: false
kev: false
summary: >-
  Avis officiel Joomla [20261111] "Core - Missing authentication in web installer". Tant que le dossier /installation existe encore
  sur un site Joomla déjà installé, un attaquant SANS authentification peut relancer l'installeur et réécrire configuration.php
  (identifiants base de données, clé secrète) -- prise de contrôle complète du site. CVSS 4.0 9.2 Critical (vecteur
  CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N), attribué le 24/11/2026 par le CNA Joomla! Project lui-même (statut
  NVD "Deferred"). Le segment AT:P ("Attack Requirements: Present") confirme la précondition : Joomla lui-même qualifie l'impact de
  Critical mais la probabilité d'exploitation de Low (grille de risque propre à l'avis : Impact Critical / Severity Moderate /
  Probability Low). Corrigé le 24/11/2026 en 5.4.11 (branche continue 4.x/5.x) et 6.2.1 (branche 6.x). Joomla n'est pas distribué via un
  paquet système -- aucun rétroportage distro, la version du code source (libraries/src/Version.php) fait foi. Aucun exploit public ni
  exploitation active connue à ce jour.
affects:
  - "Joomla CMS 4.0.0 à 5.4.10 (branche continue 4.x/5.x)"
  - "Joomla CMS 6.0.0 à 6.2.0 (branche 6.x)"
concerned:
  - "Un site fait tourner Joomla 4.0.0-5.4.10 ou 6.0.0-6.2.0 ET le dossier /installation existe encore à la racine du site (précondition CVSS AT:P)."
  - "Même sans /installation présent actuellement : le code reste vulnérable et le dossier peut être recréé par un futur déploiement -- la mise à jour de version reste recommandée."
not_concerned:
  - "Aucune installation Joomla (libraries/src/Version.php absent), ou version déjà corrigée de sa branche (>= 5.4.11 / 6.2.1)."
  - "Joomla 3.x et antérieur : architecture différente (fichier libraries/cms/version/version.php), hors du périmètre de cette CVE précise."
