tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_joomla2root.sh, run: "chmod +x test_joomla2root.sh && sudo ./test_joomla2root.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (IIS/XAMPP/WAMP/Laragon, Docker Desktop)", file: Test-Joomla2Root.ps1, run: ".\\Test-Joomla2Root.ps1 -ScanImages", note: "À lancer dans PowerShell. Joomla sous Windows natif est rare ; le cas le plus probable est Docker Desktop."}
results:
  - {status: "VULNÉRABLE", meaning: "Version Joomla vulnérable confirmée (4.0.0-5.4.10 ou 6.0.0-6.2.0), que /installation soit présent ou non.", action: "Mettre à jour vers 5.4.11/6.2.1 selon la branche ET supprimer /installation, puis revérifier."}
  - {status: "À VÉRIFIER", meaning: "Version illisible, numéro de version non reconnu (ex. Joomla 3.x ou antérieur), ou configuration.php absent.", action: "Comparer manuellement (README)."}
  - {status: "CORRIGÉ", meaning: "Version >= seuil corrigé de sa branche (peut tout de même signaler que /installation est encore présent, à supprimer par bonne pratique).", action: "Rien côté version ; supprimer /installation si encore présent."}
  - {status: "NON CONCERNÉ", meaning: "Aucune installation Joomla 4/5/6 trouvée dans les emplacements scannés.", action: "Rien dans l'immédiat pour cette CVE précise ; vérifier manuellement tout docroot hors des emplacements usuels, et toute installation Joomla 3.x ou antérieure séparément (voir README, Limites connues)."}
fix:
  - {for: "Étape 1 -- mise à jour standard via le gestionnaire de mises à jour Joomla (com_joomlaupdate)", command: "Administration Joomla : Système -> Maintenance -> Mises à jour, appliquer jusqu'à la dernière version de la branche (5.4.11 ou 6.2.1). Sauvegarder le site avant."}
  - {for: "Étape 2 -- OBLIGATOIRE, toujours, quelle que soit la version", command: "Supprimer le dossier /installation à la racine du site : rm -rf /chemin/vers/le/site/installation -- recommandé même après mise à jour, par bonne pratique de durcissement, et à réappliquer après chaque redéploiement."}
  - {for: "Étape 3 -- vérification OBLIGATOIRE", command: "Relancer test_joomla2root.sh/Test-Joomla2Root.ps1. Si encore [VULNÉRABLE], la mise à jour n'a pas atteint le seuil corrigé de sa branche (5.4.11/6.2.1) -- vérifier la version affichée dans Système -> Informations système."}
  - {for: "Mitigation immédiate, si la mise à jour doit attendre (réduit l'exposition à cette CVE précise)", command: "rm -rf /chemin/vers/le/site/installation   # neutralise le vecteur d'exploitation documenté, même sur une version non encore mise à jour"}
  - {for: "Image Docker officielle joomla", command: "docker pull joomla:5.4.11   # ou joomla:6.2.1 selon la branche -- tags non encore publiés au 27/11/2026, vérifier leur disponibilité ; appliquer la mitigation /installation en attendant"}
  - {for: "Étape finale -- toujours", command: "Relancer test_joomla2root.sh/Test-Joomla2Root.ps1 une dernière fois et confirmer [CORRIGÉ] (sans mention de /installation encore présent) avant de considérer la faille traitée."}
fixed_versions: "Joomla 5.4.11 (branche continue 4.0.0-5.4.10) ; Joomla 6.2.1 (branche 6.0.0-6.2.0), toutes deux publiées le 24/11/2026. Mitigation immédiate recommandée dans tous les cas : supprimer le dossier /installation."
