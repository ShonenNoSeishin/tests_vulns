tests:
  - os: linux
    label: "Nœud Proxmox VE (lecture seule)"
    file: test_proxmox-novembre-2026.sh
    run: "chmod +x test_proxmox-novembre-2026.sh && ./test_proxmox-novembre-2026.sh"
    note: "À lancer SUR le nœud Proxmox lui-même, pas dans un invité. Interroge uniquement dpkg, ne modifie rien."
results:
  - {status: "VULNÉRABLE", meaning: "Au moins un paquet concerné par un avis est antérieur à la version corrigée.", action: "apt update && apt full-upgrade, puis redémarrer les services concernés ou le nœud."}
  - {status: "À VÉRIFIER", meaning: "Un paquet attendu est absent — souvent le signe que ce n'est pas un nœud Proxmox VE standard.", action: "Vérifier que le script tourne bien sur l'hôte Proxmox, pas dans un invité."}
  - {status: "CORRIGÉ", meaning: "Tous les paquets concernés par un avis sont à jour.", action: "Rien."}
fix:
