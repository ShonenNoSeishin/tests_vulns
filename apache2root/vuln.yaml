id: apache2root
title: "Apache2Root — RCE non authentifiée via mod_http2 dans Apache HTTP Server"
cves: [CVE-2026-119618]
severity: critical
published: 2026-11-11
updated: 2026-11-24
exploited: false
kev: false
summary: >-
  Race condition (CWE-362) dans assign_headers() du module mod_http2 d'Apache HTTP Server, pouvant mener à une exécution de code à
  distance sans authentification quand le module HTTP/2 est chargé. CVSS 3.1 : 8.1 (High), AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H. Pas
  d'exploitation active connue (SSVC CISA : exploitation none). Corrigé en Apache httpd 2.4.71 (11/11/2026). mod_http2 n'est PAS chargé
  par défaut sur une installation Debian/Ubuntu standard -- il faut l'avoir activé explicitement (a2enmod http2) pour être exposé.
  Debian (DLA-4902-1 bookworm, DSA-6620-1 trixie) et Ubuntu (USN-9090-1) ont rétroporté le correctif sans changer le numéro de version
  amont -- le script compare le paquet dpkg, jamais 'apache2 -v' seul. Affecte aussi, séparément, le module standalone du projet GitHub
  icing/mod_h2 (2.0.8-2.0.42, corrigé en 2.0.43), dont la version ne se déduit pas du coeur Apache.
affects:
  - "Apache HTTP Server 2.4.55 à 2.4.70 (mod_http2 intégré), avec le module mod_http2 chargé"
  - "Module standalone icing/mod_h2 (GitHub) 2.0.8 à 2.0.42"
tags: [apache, httpd, web, http2, rce]
concerned:
  - "Un serveur fait tourner Apache httpd (apache2/httpd) avec le module mod_http2 chargé, en version 2.4.55 à 2.4.70."
not_concerned:
  - "Aucun Apache httpd installé, module mod_http2 non chargé, ou version déjà >= 2.4.71."
