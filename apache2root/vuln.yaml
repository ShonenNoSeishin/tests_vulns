  - {product: "Nakivo", status: "not_impacted"}
  - {product: "3CX", status: "not_impacted", note: "3CX embarque son propre nginx, pas Apache httpd (voir nginx2root)"}
  - {product: "Elastix", status: "to_check", note: "FreePBX/Elastix utilise traditionnellement Apache httpd pour son interface d'administration -- vérifier la version et si mod_http2 est chargé"}
  - {product: "Andrisoft WANGuard", status: "to_check", note: "Console web PHP, serveur web sous-jacent non documenté publiquement -- vérifier selon le déploiement"}
  - {product: "Datalust Seq", status: "not_impacted", note: "Application .NET avec serveur web intégré (Kestrel), pas Apache"}
  - {product: "LibreNMS", status: "to_check", note: "Application PHP -- documentation communautaire couvrant Apache et nginx selon le déploiement"}
  - {product: "Observium", status: "to_check", note: "Aucune information fiable trouvée sur le serveur web par défaut"}
  - {product: "Debian", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- vérifier le paquet apache2 installé dessus séparément"}
  - {product: "Ubuntu", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- vérifier le paquet apache2 installé dessus séparément"}
  - {product: "Windows Server (2012/2016/2019/2022/2025)", status: "to_check", note: "Apache httpd rare sous Windows mais possible (XAMPP/WAMP/Apache Lounge) pour des applications spécifiques"}
