  - {product: "Docker", status: "to_check", note: "Dépend si un conteneur fait tourner Apache httpd avec mod_http2 chargé en version vulnérable"}
  - {product: "LXC", status: "to_check", note: "Dépend si le conteneur fait tourner Apache httpd avec mod_http2 chargé en version vulnérable"}
