  - {product: "SFTP (Debian)", status: "not_impacted"}
  - {product: "Cisco", status: "not_impacted"}
  - {product: "Ubiquiti", status: "not_impacted"}
  - {product: "HP/Aruba", status: "not_impacted"}
  - {product: "FortiGate", status: "not_impacted"}
  - {product: "FortiAnalyzer", status: "not_impacted"}
