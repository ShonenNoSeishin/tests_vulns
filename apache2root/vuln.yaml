tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_apache2root.sh, run: "chmod +x test_apache2root.sh && sudo ./test_apache2root.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (XAMPP/WAMP/Apache Lounge, Docker Desktop)", file: Test-Apache2Root.ps1, run: ".\\Test-Apache2Root.ps1 -ScanImages", note: "À lancer dans PowerShell, en administrateur de préférence."}
results:
  - {status: "VULNÉRABLE", meaning: "Version Apache vulnérable confirmée, mod_http2 chargé.", action: "Mettre à jour vers 2.4.71 (voir correction), puis redémarrer apache2."}
  - {status: "À VÉRIFIER", meaning: "Modules illisibles, chemin de module non standard (mod_h2 séparé), ou version illisible.", action: "Comparer manuellement (README)."}
  - {status: "CORRIGÉ", meaning: "Version >= 2.4.71, mod_http2 chargé.", action: "Rien."}
  - {status: "NON CONCERNÉ", meaning: "Apache absent, ou mod_http2 non chargé.", action: "Rien dans l'immédiat pour cette CVE précise ; mettre à jour par hygiène générale reste recommandé."}
fix:
  - {for: "Debian / Ubuntu (paquet système, correctif déjà rétroporté depuis le 11/11/2026)", command: "apt update && apt install --only-upgrade apache2 && systemctl restart apache2"}
  - {for: "Image Docker officielle httpd", command: "docker pull httpd:2.4 && docker compose up -d --force-recreate   # un tag figé (ex. httpd:2.4.70) reste vulnérable, vérifier le tag réellement utilisé"}
  - {for: "Windows (XAMPP/WAMP/Apache Lounge) -- pas de rétroportage, mise à jour amont obligatoire", command: "Télécharger et réinstaller Apache httpd >= 2.4.71 depuis https://www.apachelounge.com/download/, conserver conf\\httpd.conf, redémarrer le service"}
  - {for: "Mitigation temporaire en attendant (réduit l'exposition à cette CVE uniquement)", command: "a2dismod http2 && systemctl restart apache2"}
  - {for: "Module standalone mod_h2 (projet GitHub icing/mod_h2, indépendant du paquet système)", command: "Mettre à jour vers >= 2.0.43 depuis https://github.com/icing/mod_h2/releases"}
  - {for: "Vérification finale, toujours", command: "Relancer test_apache2root.sh / Test-Apache2Root.ps1 et confirmer [CORRIGÉ] ou [NON CONCERNÉ] avant de considérer la faille traitée."}
fixed_versions: "Apache HTTP Server 2.4.71 ; module standalone icing/mod_h2 2.0.43 ; paquet Debian 13 (trixie) 2.4.71-1~deb13u1 (DSA-6620-1) ; paquet Debian 12 (bookworm) 2.4.71-1~deb12u1 (DLA-4902-1) ; paquet Ubuntu selon la table README (USN-9090-1)."
