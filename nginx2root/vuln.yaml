  - {product: "Docker", status: "to_check", note: "Dépend si un conteneur fait tourner nginx en version vulnérable"}
  - {product: "LXC", status: "to_check", note: "Dépend si le conteneur fait tourner nginx en version vulnérable"}
  - {product: "Veeam", status: "not_impacted"}
  - {product: "Nakivo", status: "not_impacted"}
  - {product: "3CX", status: "impacted", note: "Confirmé officiellement par 3CX (20/11/2026) : nginx embarqué, build propre indépendant des paquets distro -- correctif = mise à jour 3CX V20 Update 10 build 20.0.10.1801 (self-managed Linux/Windows), pas une mise à jour système. Hosted/SMB déjà patché par 3CX."}
  - {product: "Elastix", status: "not_impacted"}
  - {product: "Andrisoft WANGuard", status: "not_impacted"}
  - {product: "Datalust Seq", status: "not_impacted"}
