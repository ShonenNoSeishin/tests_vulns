id: nginx2root
title: "NGINX2Root — RCE non authentifiée via HTTP/2 dans nginx"
cves: [CVE-2026-123007, CVE-2026-123633]
severity: critical
published: 2026-11-18
updated: 2026-11-19
exploited: false
kev: false
summary: >-
  Deux failles critiques (CVSS 9.2) dans le contrôle de flux HTTP/2 de nginx permettent une exécution de code à distance sans
  authentification. CVE-2026-123007 est présente depuis 2015 ; un PoC public existe. Correctif du 18/11/2026, aucun rétroportage
  distro connu à ce jour.
affects:
  - "nginx open source < 1.30.7 (stable) ou < 1.31.9 (mainline)"
  - "nginx Plus < 37.0.8.1 / 37.3.0.1 (CVE-2026-123007) ou < 37.0.7.1 / 37.2.0.1 (CVE-2026-123633)"
tags: [nginx, web, http2, rce, reverse-proxy]
concerned:
  - "Un serveur fait tourner nginx (reverse-proxy, serveur web, ingress, panneau d'admin…) en version antérieure aux correctifs."
not_concerned:
  - "Aucun nginx installé, ou version déjà >= 1.30.7/1.31.9."
tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_nginx2root.sh, run: "chmod +x test_nginx2root.sh && sudo ./test_nginx2root.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (installeur officiel, Docker Desktop)", file: Test-Nginx2Root.ps1, run: ".\\Test-Nginx2Root.ps1 -ScanImages", note: "À lancer dans PowerShell, en administrateur de préférence."}
results:
  - {status: "VULNÉRABLE", meaning: "Version nginx vulnérable confirmée.", action: "Mettre à jour vers 1.30.7/1.31.9 (voir correction), puis recharger/redémarrer nginx."}
  - {status: "À VÉRIFIER", meaning: "nginx Plus détecté, ou version illisible.", action: "Comparer manuellement sur le portail support F5, ou relancer en root (README)."}
  - {status: "CORRIGÉ", meaning: "Version >= 1.30.7 ou >= 1.31.9.", action: "Rien."}
fix:
  - {for: "Paquet système (apt, si déjà disponible)", command: "apt update && apt install --only-upgrade nginx"}
  - {for: "Dépôt officiel nginx.org (recommandé si pas encore dans apt/dnf)", command: "Suivre nginx.org/en/linux_packages.html puis apt/dnf update"}
  - {for: "Alpine", command: "apk update && apk upgrade nginx"}
  - {for: "Image Docker officielle", command: "docker pull nginx:<tag-reconstruit> && docker compose up -d --force-recreate"}
  - {for: "Contournement temporaire (HTTP/2 seulement, ne couvre pas les 8 autres CVE du lot)", command: "Retirer le paramètre http2 des directives listen, ou http2 off; puis nginx -s reload"}
fixed_versions: "nginx 1.30.7 (stable), 1.31.9 (mainline) ; nginx Plus 37.0.8.1/37.3.0.1 et 37.0.7.1/37.2.0.1 selon le CVE."
docs: [README.md]
references:
  - {title: "Avis officiel nginx", url: "https://nginx.org/en/security_advisories.html"}
  - {title: "Wiz — analyse technique", url: "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities"}
  - {title: "The Hacker News", url: "https://thehackernews.com/2026/11/10-year-old-nginx-http2-flaw-lets.html"}
  - {title: "Qualys — NGINX2Root", url: "https://blog.qualys.com/product-tech/patch-management/2026/11/18/nginx2root-five-nginx-flaws-led-by-cve-2026-123007-how-to-find-mitigate-and-patch-now"}
