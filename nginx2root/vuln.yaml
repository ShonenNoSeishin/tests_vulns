tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_nginx2root.sh, run: "chmod +x test_nginx2root.sh && sudo ./test_nginx2root.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (installeur officiel, Docker Desktop)", file: Test-Nginx2Root.ps1, run: ".\\Test-Nginx2Root.ps1 -ScanImages", note: "À lancer dans PowerShell, en administrateur de préférence."}
results:
  - {status: "VULNÉRABLE", meaning: "Version nginx vulnérable confirmée.", action: "Mettre à jour vers 1.30.7/1.31.9 (voir correction), puis recharger/redémarrer nginx."}
  - {status: "À VÉRIFIER", meaning: "nginx Plus détecté, ou version illisible.", action: "Comparer manuellement sur le portail support F5, ou relancer en root (README)."}
  - {status: "CORRIGÉ", meaning: "Version >= 1.30.7 ou >= 1.31.9.", action: "Rien."}
fix:
  - {for: "Étape 1 -- Debian/Ubuntu, tenter la mise à jour standard", command: "apt update && apt install --only-upgrade nginx"}
  - {for: "Étape 2 -- OBLIGATOIRE, vérifier que l'étape 1 a réellement corrigé", command: "Relancer test_nginx2root.sh / Test-Nginx2Root.ps1. Depuis le 19/11/2026, Debian (DLA-4918-1/DSA-6642-1) ET Ubuntu (USN-9159-1) ont un correctif rétroporté : le script compare le paquet dpkg, pas nginx -v, donc [CORRIGÉ] s'affichera correctement même si nginx -v semble ancien. Si le résultat affiche encore [VULNÉRABLE] malgré ça (dépôt de sécurité en retard, miroir non synchronisé, distribution non couverte par la table du script), passer à l'étape 3. 'already the newest version' ne prouve PAS que c'est corrigé."}
  - {for: "Étape 3 -- SI toujours [VULNÉRABLE] après l'étape 2 : basculer sur le dépôt officiel nginx.org", command: 'sudo apt install -y curl gnupg2 ca-certificates lsb-release debian-archive-keyring && curl https://nginx.org/keys/nginx_signing.key | gpg --dearmor | sudo tee /usr/share/keyrings/nginx-archive-keyring.gpg >/dev/null && echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/debian $(lsb_release -cs) nginx" | sudo tee /etc/apt/sources.list.d/nginx.list && printf "Package: *\nPin: origin nginx.org\nPin: release o=nginx\nPin-Priority: 900\n" | sudo tee /etc/apt/preferences.d/99nginx && sudo apt update && sudo apt install nginx && sudo systemctl restart nginx'}
  - {for: "Alpine", command: "apk update && apk upgrade nginx"}
  - {for: "Image Docker officielle", command: "docker pull nginx:<tag-reconstruit> && docker compose up -d --force-recreate"}
  - {for: "Contournement temporaire en attendant (HTTP/2 seulement, ne couvre pas les 8 autres CVE du lot)", command: "Retirer le paramètre http2 des directives listen, ou http2 off; puis nginx -s reload"}
  - {for: "Étape 4 -- toujours, après l'étape 3 ou tout autre correctif", command: "Relancer test_nginx2root.sh / Test-Nginx2Root.ps1 une dernière fois et confirmer [CORRIGÉ] (version >= 1.30.7/1.31.9, ou paquet >= au seuil Debian/Ubuntu du README) avant de considérer la faille traitée."}
fixed_versions: "nginx 1.30.7 (stable), 1.31.9 (mainline) ; nginx Plus 37.0.8.1/37.3.0.1 et 37.0.7.1/37.2.0.1 selon le CVE ; paquet Debian 13 (trixie) 1.26.3-3+deb13u11 (DSA-6642-1) ; paquet Debian 12 (bookworm) 1.22.1-9+deb12u11 (DLA-4918-1) ; paquet Ubuntu selon la table README (USN-9159-1) ; 3CX self-managed V20 Update 10 build 20.0.10.1801 (nginx embarqué, correctif distinct du paquet système)."
