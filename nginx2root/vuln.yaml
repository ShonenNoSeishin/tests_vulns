id: nginx2root
title: "NGINX2Root — RCE non authentifiée via HTTP/2 dans nginx"
cves: [CVE-2026-123007, CVE-2026-123633]
severity: critical
published: 2026-11-18
updated: 2026-11-23
exploited: false
kev: false
summary: >-
  Deux failles critiques (CVSS 9.2) dans le contrôle de flux HTTP/2 de nginx permettent une exécution de code à distance sans
  authentification. CVE-2026-123007 est présente depuis 2015 ; un PoC public existe. Correctif du 18/11/2026 chez l'éditeur ; Ubuntu
  (USN-9159-1) et Debian (DLA-4918-1 bookworm, DSA-6642-1 trixie) ont tous les deux rétroporté le correctif le 19/11/2026 SANS changer le
  numéro de version amont -- le script compare le paquet dpkg pour les deux distributions, jamais 'nginx -v' seul. Un simple
  'apt update && apt install --only-upgrade nginx' suffit désormais pour Debian ET Ubuntu ; revérifier avec le script, et si toujours
  vulnérable (dépôt en retard, distribution non couverte) basculer sur le dépôt officiel nginx.org.
affects:
  - "nginx open source < 1.30.7 (stable) ou < 1.31.9 (mainline)"
  - "nginx Plus < 37.0.8.1 / 37.3.0.1 (CVE-2026-123007) ou < 37.0.7.1 / 37.2.0.1 (CVE-2026-123633)"
tags: [nginx, web, http2, rce, reverse-proxy]
concerned:
  - "Un serveur fait tourner nginx (reverse-proxy, serveur web, ingress, panneau d'admin…) en version antérieure aux correctifs."
not_concerned:
  - "Aucun nginx installé, ou version déjà >= 1.30.7/1.31.9."
impact:
