  - {product: "Sophos", status: "not_impacted"}
  - {product: "nginx", status: "impacted", note: "Composant directement concerné"}
  - {product: "Certbot", status: "not_impacted", note: "Certbot lui-même n'est pas nginx, seul son plugin nginx interagit avec -- la faille est dans nginx, pas dans Certbot"}
