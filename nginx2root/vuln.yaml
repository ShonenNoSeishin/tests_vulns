  - {product: "Docker", status: "to_check", note: "Dépend si un conteneur fait tourner nginx en version vulnérable"}
  - {product: "LXC", status: "to_check", note: "Dépend si le conteneur fait tourner nginx en version vulnérable"}
  - {product: "Veeam", status: "not_impacted"}
  - {product: "Nakivo", status: "not_impacted"}
  - {product: "3CX", status: "impacted", note: "3CX (Linux, Debian) utilise nginx comme serveur web / reverse-proxy de la console et des clients web : lancer le script sur le serveur 3CX ; correctif via les mises à jour 3CX/Debian dès leur publication, HTTP/2 off en attendant"}
  - {product: "Elastix", status: "not_impacted"}
  - {product: "Andrisoft WANGuard", status: "not_impacted"}
  - {product: "Datalust Seq", status: "not_impacted"}
  - {product: "LibreNMS", status: "not_impacted"}
  - {product: "Observium", status: "not_impacted"}
  - {product: "Debian", status: "not_impacted"}
  - {product: "Ubuntu", status: "not_impacted"}
  - {product: "Windows Server (2012/2016/2019/2022/2025)", status: "to_check", note: "nginx pour Windows existe, plus rare mais possible"}
  - {product: "SMB (Samba, Debian)", status: "not_impacted"}
  - {product: "SFTP (Debian)", status: "not_impacted"}
  - {product: "Cisco", status: "not_impacted"}
  - {product: "Ubiquiti", status: "not_impacted"}
  - {product: "HP/Aruba", status: "not_impacted"}
  - {product: "FortiGate", status: "not_impacted"}
