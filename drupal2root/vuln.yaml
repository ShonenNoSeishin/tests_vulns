  - {product: "Docker", status: "to_check", note: "Dépend si un conteneur fait tourner Drupal Core en version vulnérable"}
  - {product: "LXC", status: "to_check", note: "Dépend si le conteneur fait tourner Drupal Core en version vulnérable"}
  - {product: "Veeam", status: "not_impacted"}
  - {product: "Nakivo", status: "not_impacted"}
  - {product: "3CX", status: "not_impacted", note: "3CX embarque son propre nginx, pas Drupal"}
  - {product: "Elastix", status: "not_impacted", note: "FreePBX/Elastix utilise son propre framework d'administration, pas Drupal"}
  - {product: "Andrisoft WANGuard", status: "not_impacted", note: "Console web PHP, aucune indication d'une dépendance Drupal"}
  - {product: "Datalust Seq", status: "not_impacted", note: "Application .NET avec serveur web intégré (Kestrel), pas Drupal"}
  - {product: "LibreNMS", status: "not_impacted", note: "Application PHP indépendante, pas basée sur Drupal"}
  - {product: "Observium", status: "not_impacted", note: "Application PHP indépendante, pas basée sur Drupal"}
  - {product: "Debian", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- Drupal n'est pas un paquet système"}
  - {product: "Ubuntu", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- Drupal n'est pas un paquet système"}
  - {product: "Windows Server (2012/2016/2019/2022/2025)", status: "to_check", note: "Drupal sous Windows est rare (pas de build officiel) mais possible via IIS+PHP ou Docker Desktop"}
