id: drupal2root
title: "Drupal2Root — RCE/prise de contrôle non authentifiée via install.php dans Drupal Core"
cves: [CVE-2026-132165]
severity: critical
published: 2026-11-18
updated: 2026-11-25
exploited: true
kev: true
summary: >-
  "Highly critical" 20/25 selon l'avis officiel SA-CORE-2026-017. Sous conditions spécifiques, install.php peut être utilisé pour relancer
  l'installeur sur un site Drupal déjà installé, menant à une prise de contrôle du site ou une exécution de code à distance SANS
  authentification. Un des chemins d'exploitation est mitigé si le serveur web ne peut pas écrire/changer les permissions de settings.php,
  mais pas tous. Exploitation active signalée par l'équipe sécurité Drupal elle-même dès le 19/11/2026 19h00 UTC sur des sites en
  production -- ajoutée au catalogue KEV CISA le 24/11/2026. Corrigé en Drupal 10.6.22 / 11.3.22 / 11.4.13 (18/11/2026). Drupal n'est pas
  distribué via un paquet système (apt/dnf/apk) -- aucun rétroportage distro, la version du code source (core/lib/Drupal.php) fait foi.
  Drupal 8/9 et les branches 10.5.x/11.2.x et antérieures sont en fin de vie : toujours affectées, mais ne recevront jamais de correctif
  direct -- seule une migration de branche majeure corrige la faille pour ces versions.
affects:
  - "Drupal Core 10.x < 10.6.22"
  - "Drupal Core 11.0.0 à 11.3.21 (< 11.3.22)"
  - "Drupal Core 11.4.0 à 11.4.12 (< 11.4.13)"
  - "Drupal Core 8.x et 9.x (fin de vie depuis 2021/2023, toujours affectées, sans correctif)"
concerned:
  - "Un site fait tourner Drupal Core en version < 10.6.22, ou >= 11.0.0 < 11.3.22, ou >= 11.4.0 < 11.4.13, ou toute version 8.x/9.x."
not_concerned:
  - "Aucune installation Drupal (core/lib/Drupal.php absent), ou version Drupal déjà corrigée de sa branche (>= 10.6.22 / 11.3.22 / 11.4.13)."
