tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_drupal2root.sh, run: "chmod +x test_drupal2root.sh && sudo ./test_drupal2root.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (IIS/XAMPP/WAMP/Laragon, Docker Desktop)", file: Test-Drupal2Root.ps1, run: ".\\Test-Drupal2Root.ps1 -ScanImages", note: "À lancer dans PowerShell. Drupal sous Windows natif est rare ; le cas le plus probable est Docker Desktop."}
results:
  - {status: "VULNÉRABLE", meaning: "Version Drupal vulnérable confirmée (branche maintenue, en-dessous du seuil corrigé, ou branche en fin de vie).", action: "Mettre à jour vers le seuil corrigé de sa branche (voir correction), ou migrer si branche EOL, puis revérifier."}
  - {status: "À VÉRIFIER", meaning: "Version illisible, ou numéro de version non reconnu par ce script.", action: "Comparer manuellement (README)."}
  - {status: "CORRIGÉ", meaning: "Version >= seuil corrigé de sa branche.", action: "Rien."}
  - {status: "NON CONCERNÉ", meaning: "Aucune installation Drupal trouvée dans les emplacements scannés.", action: "Rien dans l'immédiat pour cette CVE précise ; vérifier manuellement tout docroot hors des emplacements usuels (voir README, Limites connues)."}
fix:
  - {for: "Branche maintenue (10.6.x, 11.3.x ou 11.4.x) -- mise à jour Composer standard", command: "composer require 'drupal/core:^10.6.22' 'drupal/core-recommended:^10.6.22' --update-with-dependencies && drush updatedb -y   # adapter le numéro de version à la branche (11.3.22 ou 11.4.13)"}
  - {for: "Vérification -- OBLIGATOIRE", command: "Relancer test_drupal2root.sh/Test-Drupal2Root.ps1. Si encore [VULNÉRABLE], la mise à jour Composer n'a pas abouti (dépendance figée, cache, mauvaise branche ciblée) -- vérifier composer.lock."}
  - {for: "Branche EN FIN DE VIE (Drupal 7/8/9, ou 10.0-10.5.x, ou 11.0-11.2.x) -- aucun correctif direct", command: "Migration de branche majeure obligatoire (ex. vers 10.6.x ou 11.4.x) : projet à part entière, à escalader équipe sécu/infra, pas une action L1. Appliquer la mitigation temporaire ci-dessous en attendant."}
  - {for: "Mitigation temporaire (réduit l'exposition en attendant la mise à jour/migration)", command: "Bloquer l'accès réseau à /core/install.php cote serveur web (nginx: 'location = /core/install.php { deny all; return 404; }' ; Apache: '<Files install.php> Require all denied </Files>'), ou retirer le fichier après installation (à réappliquer après chaque déploiement qui le restaure)."}
  - {for: "Image Docker officielle drupal", command: "docker pull drupal:10.6-php8.3-apache && docker compose up -d --force-recreate   # un tag figé (ex. drupal:10.6.21-php8.3-apache) reste vulnérable, vérifier le tag réellement utilisé"}
  - {for: "Vérification finale, toujours", command: "Relancer test_drupal2root.sh/Test-Drupal2Root.ps1 une dernière fois et confirmer [CORRIGÉ] avant de considérer la faille traitée."}
fixed_versions: "Drupal Core 10.6.22 ; 11.3.22 ; 11.4.13 (toutes publiées le 18/11/2026). Aucun correctif pour Drupal 7/8/9 ni pour les branches 10.5.x et antérieures / 11.2.x et antérieures (fin de vie -- migration de branche nécessaire)."
