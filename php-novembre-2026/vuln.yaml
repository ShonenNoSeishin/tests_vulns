tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_php-novembre-2026.sh, run: "chmod +x test_php-novembre-2026.sh && sudo ./test_php-novembre-2026.sh --scan-images", note: "Lecture seule. --scan-images inspecte aussi les images locales."}
  - {os: windows, label: "Windows (XAMPP/WAMP, IIS, Docker Desktop)", file: Test-PhpNovembre2026.ps1, run: ".\\Test-PhpNovembre2026.ps1 -ScanImages", note: "À lancer dans PowerShell, en administrateur de préférence."}
results:
  - {status: "VULNÉRABLE", meaning: "Version/paquet PHP antérieur au seuil corrigé de sa branche.", action: "Mettre à jour PHP (voir correction), puis redémarrer php-fpm/Apache/IIS."}
  - {status: "À VÉRIFIER", meaning: "Branche non référencée pour ce lot (toute combinaison Ubuntu autre que 24.04/php8.3 et 22.04/php8.1), ou version illisible.", action: "Contrôler manuellement (README), revérifier régulièrement si Ubuntu."}
  - {status: "CORRIGÉ", meaning: "Version ou paquet corrigé pour ce lot.", action: "Rien."}
fix:
  - {for: "Étape 1 -- Debian/Ubuntu, tenter la mise à jour standard", command: "apt update && apt install --only-upgrade 'php*'"}
  - {for: "Étape 2 -- OBLIGATOIRE, vérifier que l'étape 1 a réellement corrigé", command: "Relancer test_php-novembre-2026.sh / Test-PhpNovembre2026.ps1. Debian a déjà le correctif en dépôt (DLA-4916-1/DSA-6641-1) : l'étape 1 suffit. Ubuntu 24.04/php8.3 et 22.04/php8.1 aussi (confirmé 23/11/2026 via le security tracker officiel, sans USN dédiée). Toute autre version Ubuntu : le script affichera [À VÉRIFIER], pas [CORRIGÉ], tant que ce n'est pas confirmé. 'already the newest version' ne prouve PAS que c'est corrigé pour ce lot précis."}
  - {for: "Étape 3 -- Ubuntu (hors 24.04/php8.3 et 22.04/php8.1) SI toujours [À VÉRIFIER]/[VULNÉRABLE] après l'étape 2 et qu'une version corrigée est nécessaire immédiatement", command: "Envisager le dépôt tiers maintenu par Ondřej Surý (packages.sury.org/php/) qui suit l'amont PHP de près, en connaissance de cause (dépôt non officiel Ubuntu/Debian, calendrier de correctifs propre) -- ou compiler/installer la version officielle depuis php.net en l'isolant du gestionnaire de paquets système."}
  - {for: "Image Docker officielle", command: "docker pull php:<tag-reconstruit-après-le-19/11/2026> && docker compose up -d --force-recreate"}
  - {for: "Mitigation temporaire (CVE-2026-129474, branche 8.5 uniquement)", command: "zend.exception_ignore_args = 1  # dans php.ini (valeur par défaut de php.ini-production), puis redémarrer les workers"}
  - {for: "PHP ≤ 8.1 sans correctif pour ce lot", command: "Migrer vers 8.2 / 8.3 / 8.4 / 8.5, ou isoler le service."}
  - {for: "Étape finale -- toujours", command: "Relancer test_php-novembre-2026.sh / Test-PhpNovembre2026.ps1 une dernière fois et confirmer [CORRIGÉ] avant de considérer la faille traitée."}
fixed_versions: "PHP 8.5.13, 8.4.28, 8.3.37, 8.2.36 (+ 8.6.0 GA) ; paquet Debian 12 php8.2-* 8.2.36-1~deb12u1 (DLA-4916-1) ; paquet Debian 13 php8.4-* 8.4.28-1~deb13u1 (DSA-6641-1) ; paquet Ubuntu 24.04 php8.3-* 8.3.6-0ubuntu0.24.04.14 et Ubuntu 22.04 php8.1-* 8.1.2-1ubuntu2.29 (confirmé 23/11/2026 via le security tracker officiel, sans USN dédiée) ; autres versions Ubuntu non confirmées à ce jour."
