id: php-novembre-2026
title: "PHP — lot de correctifs de sécurité du 19/11/2026 (18 CVE)"
cves: [CVE-2026-129474, CVE-2026-129182, CVE-2026-129538, CVE-2026-129496, CVE-2026-129501, CVE-2026-129291, CVE-2026-129289, CVE-2026-129292, CVE-2026-129481, CVE-2026-126714, CVE-2026-115560, CVE-2026-15353, CVE-2026-129506, CVE-2026-48841, CVE-2026-129438, CVE-2026-128064, CVE-2026-127960, CVE-2026-128090]
severity: critical
published: 2026-11-19
updated: 2026-11-23
exploited: false
kev: false
summary: >-
  18 CVE distinctes corrigées le 19/11/2026 dans PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13 (+ sortie stable de 8.6.0). Lot SÉPARÉ de PHP2Shell
  (CVE-2026-109618/109619, dossier php2shell/, aucune CVE en commun). Trois CVE confirmées CVSS 9.2 (CVSS v4.0, vérifié sur les avis GHSA
  officiels) permettent une RCE -- CVE-2026-129474 (PHP 8.5 uniquement), CVE-2026-129496 (toutes branches), CVE-2026-129289 (FPM request
  smuggling, toutes branches, nécessite des connexions FastCGI persistantes type fastcgi_keep_conn) -- mais toutes nécessitent des conditions
  précises (voir README), pas une RCE triviale en configuration par défaut. Debian a déjà le correctif en dépôt (DLA-4916-1 bookworm, DSA-6641-1
  trixie) ; Ubuntu aussi, confirmé le 23/11/2026 via le security tracker officiel (sans USN dédiée) pour 24.04/php8.3 et 22.04/php8.1 -- à
  revérifier pour les autres versions Ubuntu.
affects:
  - "PHP 8.5 < 8.5.13"
  - "PHP 8.4 < 8.4.28"
  - "PHP 8.3 < 8.3.37"
  - "PHP 8.2 < 8.2.36"
  - "PHP ≤ 8.1 (fin de vie, sans correctif officiel pour ce lot)"
  - "CVE-2026-129474 : PHP 8.5.x uniquement (8.5.0 à 8.5.12)"
tags: [php, web, rce, use-after-free]
concerned:
  - "Un serveur web exécute PHP (Apache, nginx + PHP-FPM, IIS, XAMPP/WAMP, conteneur Docker PHP…) en version antérieure au seuil corrigé de sa branche."
not_concerned:
  - "Aucun PHP installé, ou version déjà >= 8.2.36/8.3.37/8.4.28/8.5.13 selon la branche. Un paquet Debian avec le correctif rétroporté est correct même si PHP_VERSION paraît ancien (le script le vérifie)."
