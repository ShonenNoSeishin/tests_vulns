id: broccoli2shell
title: "Broccoli2Shell — faille du décodeur Brotli (Node.js, Python, .NET, Linux, IIS)"
cves: [CVE-2026-111497]
severity: critical
published: 2026-10-27
updated: 2026-11-19
exploited: true
kev: true
summary: >-
  Le décodeur Brotli (compression web) peut être corrompu par un flux spécialement construit : toute application qui décompresse du Brotli non
  vérifié est exposée. Exploitée activement (KEV du 27/10/2026). La bibliothèque est copiée dans Node.js, Python, .NET, IIS et de nombreux
  logiciels : chaque pile se corrige séparément.
affects:
  - "libbrotli 1.0.3 à 1.2.0"
  - "Node.js, Python (brotli/brotlicffi), .NET, IIS, copies embarquées (Pillow, 7-Zip, DuckDB, woff2…)"
tags: [brotli, node, python, dotnet, web]
concerned:
  - "Un serveur ou une application traite du contenu `Content-Encoding: br` ou des fichiers compressés en Brotli (Node.js, Python, .NET, IIS, Nginx…)."
not_concerned:
  - "Piles sans Brotli ou déjà dans une version corrigée."
impact:
  - {product: "Proxmox VE", status: "not_impacted", note: "pve-manager/pveproxy n'utilisent pas Brotli par défaut"}
  - {product: "Docker", status: "to_check", note: "Dépend des images : Node.js/Python/.NET/IIS sont les vecteurs documentés"}
  - {product: "LXC", status: "to_check", note: "Même raison que Docker"}
  - {product: "Veeam", status: "not_impacted"}
  - {product: "Nakivo", status: "not_impacted"}
  - {product: "3CX", status: "not_impacted"}
  - {product: "Elastix", status: "not_impacted"}
  - {product: "Andrisoft WANGuard", status: "not_impacted"}
  - {product: "Datalust Seq", status: "to_check", note: "Application .NET -- le runtime .NET est explicitement listé comme vecteur"}
  - {product: "LibreNMS", status: "not_impacted"}
  - {product: "Observium", status: "not_impacted"}
  - {product: "Debian", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- vérifier le paquet système libbrotli1, couvert par le script"}
  - {product: "Ubuntu", status: "not_impacted", note: "L'OS lui-même n'est pas en cause -- vérifier le paquet système libbrotli1, couvert par le script"}
  - {product: "Windows Server (2012/2016/2019/2022/2025)", status: "to_check", note: "Module de compression dynamique Brotli d'IIS explicitement listé comme vecteur"}
  - {product: "SMB (Samba, Debian)", status: "not_impacted"}
  - {product: "SFTP (Debian)", status: "not_impacted"}
  - {product: "Cisco", status: "not_impacted"}
  - {product: "Ubiquiti", status: "not_impacted"}
  - {product: "HP/Aruba", status: "not_impacted"}
  - {product: "FortiGate", status: "not_impacted"}
  - {product: "FortiAnalyzer", status: "not_impacted"}
  - {product: "FortiManager", status: "not_impacted"}
  - {product: "Sophos", status: "not_impacted"}
  - {product: "nginx", status: "to_check", note: "Impacté seulement si compilé avec le module tiers ngx_brotli (pas d'office en standard)"}
  - {product: "Certbot", status: "not_impacted"}
  - {product: "Odoo (self-hosted)", status: "to_check", note: "Python -- dépend si les dépendances HTTP d'Odoo utilisent brotli/brotlicffi"}
  - {product: "Nextcloud", status: "to_check", note: "PHP -- usage possible de compression Brotli côté serveur ou CDN, à vérifier"}
  - {product: "JumpCloud", status: "not_impacted"}
  - {product: "Python", status: "impacted", note: "Paquets PyPI Brotli/brotlicffi directement nommés"}
  - {product: "Django", status: "to_check", note: "Dépend si l'application Django utilise brotli/brotlicffi comme dépendance HTTP"}
  - {product: "React", status: "to_check", note: "Le tooling de build Node.js peut embarquer le décodeur Brotli interne de Node -- dépend de la version Node utilisée en CI/build"}
  - {product: "PHP", status: "not_impacted", note: "PHP lui-même n'embarque pas le décodeur Brotli par défaut"}
  - {product: "MikroTik", status: "not_impacted"}
  - {product: "Ceph", status: "not_impacted"}
  - {product: "QEMU-KVM", status: "not_impacted"}
tests:
  - {os: linux, label: "Linux / macOS (hôte + conteneurs)", file: test_broccoli2shell.sh, run: "chmod +x test_broccoli2shell.sh && sudo ./test_broccoli2shell.sh --scan-images", note: "Lecture seule. Inventorie binaires, paquets, runtimes et conteneurs."}
  - {os: windows, label: "Windows (IIS, Node, Python, .NET)", file: Test-Broccoli2Shell.ps1, run: ".\\Test-Broccoli2Shell.ps1 -ScanImages", note: "À lancer dans PowerShell, en administrateur de préférence."}
results:
  - {status: "VULNÉRABLE", meaning: "Version vulnérable du décodeur confirmée.", action: "Mettre à jour la pile concernée (Node, Python, .NET, paquet système, application)."}
  - {status: "À VÉRIFIER", meaning: "Copie embarquée ou version non identifiable.", action: "Mettre à jour l'application qui embarque la copie."}
  - {status: "CORRIGÉ", meaning: "Version corrigée.", action: "Rien."}
fix:
  - {for: "Paquet système (Debian/Ubuntu)", command: "apt update && apt install --only-upgrade libbrotli1"}
  - {for: "Paquet système (Alpine)", command: "apk upgrade brotli-libs"}
  - {for: "Python", command: "pip install --upgrade brotli brotlicffi"}
  - {for: "Node.js / .NET", command: "Mettre à jour le runtime lui-même (la copie est interne) : voir le tableau du README."}
  - {for: "Image Docker", command: "docker build --pull --no-cache -t mon-app . && docker compose up -d --force-recreate"}
docs: [README.md]
references:
  - {title: "CISA KEV (ajout du 27/10/2026)", url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"}
