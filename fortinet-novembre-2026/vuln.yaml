tests:
  - os: linux
    label: "Linux / macOS — comparer une version"
    file: check_fortinet_version.sh
    run: "chmod +x check_fortinet_version.sh && ./check_fortinet_version.sh fortimanager 7.6.5"
    note: "Aucune connexion au pare-feu : vous donnez la version lue dans l'interface ou par `get system status`. Vérifie tous les avis applicables au produit donné (fortimanager/fortianalyzer-bigdata/fortios)."
  - os: windows
    label: "Windows — comparer une version"
    file: Check-FortinetVersion.ps1
    run: ".\\Check-FortinetVersion.ps1 -Product fortimanager -Version 7.6.5"
    note: "Même logique en PowerShell."
results:
  - {status: "VULNÉRABLE", meaning: "Version antérieure à la version corrigée d'au moins un avis applicable.", action: "Planifier la mise à jour (sauvegarde de la configuration d'abord) ou appliquer le contournement en attendant."}
  - {status: "À VÉRIFIER", meaning: "Branche non listée dans un avis, ou version illisible.", action: "Consulter le portail PSIRT Fortinet."}
  - {status: "CORRIGÉ", meaning: "Version corrigée pour tous les avis applicables à cette branche.", action: "Viser la dernière version de la branche : le lot compte d'autres corrections."}
fix:
  - {for: "FortiManager / FortiAnalyzer", command: "Mise à niveau vers 8.0.1+/7.6.8+/7.4.6+/7.2.9+ (FGFM) et 8.0.3+/7.6.8+ (API JRPC) — Système > Paramètres > Firmware ; sauvegarder avant."}
  - {for: "FortiAnalyzer-BigData", command: "Mise à niveau vers 7.6.3 ou plus récent (API JRPC)."}
  - {for: "FortiOS (FortiGate)", command: "Mise à niveau vers 8.0.2 / 7.6.8 / 7.4.13 / 7.2.14 (ou plus récent) — Système > Firmware ; un nœud de cluster à la fois. La branche 7.0 n'a pas de correctif : migrer."}
  - {for: "En attendant (API JSON, FG-IR-26-219)", command: "config system admin profile / edit <profil> / set rpc-permit none  # si l'API JSON était activée"}
  - {for: "En attendant (FGFM, FG-IR-26-275)", command: "Restreindre le port FGFM (TCP 541) et l'accès d'administration aux seuls réseaux de gestion ; ne jamais les exposer à Internet."}
fixed_versions: "FortiManager/FortiAnalyzer : 8.0.1/7.6.8/7.4.6/7.2.9 (FGFM), 8.0.3/7.6.8 (API JRPC, 8.0.3 annoncé non publié au 19/11). BigData : 7.6.3. FortiOS : 8.0.2, 7.6.8, 7.4.13, 7.2.14."
