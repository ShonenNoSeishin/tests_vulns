id: fortinet-novembre-2026
title: "Fortinet — lot de correctifs de novembre 2026 (FortiManager, FortiAnalyzer, FortiOS)"
cves: [CVE-2026-126261, CVE-2026-126170, CVE-2026-126253]
severity: critical
published: 2026-11-10
updated: 2026-11-19
exploited: false
kev: false
summary: >-
  Fortinet a publié le 10 novembre une centaine de correctifs. Trois avis vérifiés : FortiManager/FortiAnalyzer FGFM (CVSS 9.0), injection
  JSON API JRPC FortiManager/FortiAnalyzer/BigData (CVSS 9.8, ajoutée le 19/11) et FortiOS OSPF (CVSS 9.3). Pas d'exploitation connue à ce
  jour, mais les produits Fortinet sont des cibles habituelles : mettre à jour rapidement.
affects:
  - FortiManager / FortiAnalyzer (FG-IR-26-275) 8.0.0, 7.6.0–7.6.7, 7.4.0–7.4.5, 7.2.0–7.2.8
  - FortiManager / FortiAnalyzer (FG-IR-26-219) 8.0.0–8.0.2, 7.6.0–7.6.7 ; FortiAnalyzer-BigData 7.6.0–7.6.2
  - FortiOS (FG-IR-26-267) 8.0.0–8.0.1, 7.6.0–7.6.7, 7.4.0–7.4.12, 7.2.0–7.2.13, 7.0.1–7.0.19
tags: [fortinet, pare-feu, fortios, fortimanager, fortianalyzer]
concerned:
  - "Vous administrez un FortiManager ou FortiAnalyzer dans une des versions ci-dessus, surtout si le port FGFM (TCP 541) est joignable depuis un réseau non fiable, ou si l'API JSON est activée sur un profil admin."
  - "Vous avez un FortiGate (FortiOS) dans une des versions ci-dessus avec OSPF activé (attaque depuis un réseau adjacent)."
not_concerned:
  - "Versions ≥ 8.0.2 / 7.6.8 / 7.4.13 / 7.2.14 (FortiOS) ou ≥ 8.0.1 / 7.6.8 / 7.4.6 / 7.2.9 (FortiManager, avis FGFM) et ≥ 7.6.8 (avis API JRPC, branche 7.4/7.2 non concernée par cet avis)."
  - "FortiMail, FortiSASE et les autres produits du lot : voir le portail PSIRT (non couverts par l'outil de ce dossier)."
